<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f7">
<title>Vertical Rio — Antes de voar</title>
<link rel="icon" href="assets/logo.svg">
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;
  --brand:#f5c400;--brand-dark:#d9ad00;--red:#d70015;--radius:18px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:16px 20px 24px}
.topo{display:flex;align-items:center;gap:16px;min-height:48px}
.topo img{height:34px}
.barra{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.tela{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.bloco{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:clamp(26px,4.4vw,40px);line-height:1.15;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
.ajuda{color:var(--muted);margin:0 0 18px;font-size:18px}
.opcoes{display:grid;gap:12px;margin-top:14px}
@media (min-width:720px){.opcoes.duas{grid-template-columns:1fr 1fr}}
.op{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:68px;padding:16px 20px;
  background:var(--card);border:2px solid transparent;border-radius:var(--radius);box-shadow:var(--shadow);font-size:20px;font-weight:500;transition:transform .08s,border-color .15s,background .15s}
.op:active{transform:scale(.985)}
.op .marca{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:800;color:transparent}
.op.multi .marca{border-radius:8px}
.op.sel{border-color:var(--brand);background:#fffbe6}
.op.sel .marca{background:var(--brand);border-color:var(--brand);color:var(--fg)}
.campo{width:100%;font-size:30px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:18px 20px;border:2px solid var(--line);
  border-radius:var(--radius);background:var(--card);outline:none;user-select:text;-webkit-user-select:text}
.campo.livre{letter-spacing:0;text-transform:none;font-weight:500;font-size:24px}
.campo:focus{border-color:var(--brand)}
.erro{color:var(--red);min-height:26px;margin:8px 0 0;font-size:17px}
.acoes{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
.btn{min-height:60px;padding:0 28px;border-radius:99px;border:0;font-size:20px;font-weight:700;background:var(--brand)}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:transparent;border:2px solid var(--line);font-weight:600}
.rodape{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.voltar{background:none;border:0;color:var(--muted);font-size:18px;padding:12px 4px}
.inicio{text-align:center;align-items:center}
.inicio h1{font-size:clamp(32px,6vw,52px)}
.idiomas{display:grid;gap:14px;width:100%;max-width:520px;margin-top:22px}
.idiomas .op{justify-content:center;font-size:24px;font-weight:700;min-height:80px}
.sub{color:var(--muted);font-size:20px;margin:0}
.obrigado{text-align:center;align-items:center}
.obrigado .ok{width:96px;height:96px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:52px;margin-bottom:22px}
.teste{position:fixed;left:0;right:0;bottom:0;background:#1d1d1f;color:#fff;text-align:center;font-size:13px;padding:5px 8px;z-index:9;opacity:.85}
.fila{position:fixed;right:10px;top:10px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="config.js"></script>
<script src="perguntas.js"></script>
<script src="app.js"></script>
</body>
</html>
